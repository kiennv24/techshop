<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cấu hình sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #efefef; }
        .preview-img { max-width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; border: 1px solid #dee2e6; margin-top: 10px; }
        .actions-sidebar { position: sticky; top: 24px; }
    </style>
</head>
<body class="p-3">
<div th:replace="~{admin/header :: header}"></div>

<div class="container-fluid mt-4 px-4">
    <h2 class="h4 mb-4 text-dark fw-bold" th:text="${product.id == null} ? '📦 Thêm sản phẩm mới' : '⚙️ Chỉnh sửa sản phẩm #' + ${product.id}"></h2>
    
    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
        
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{rating}" />
        <input type="hidden" th:field="*{sold}" />
        <input type="hidden" th:field="*{discount}" />

        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header py-3">
                        <h6 class="mb-0 text-secondary font-weight-bold">Thông tin sản phẩm cơ bản</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input class="form-control" type="text" th:field="*{name}" placeholder="Nhập tên sản phẩm thương mại..." required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Mô tả chi tiết</label>
                            <textarea class="form-control" th:field="*{description}" rows="5" placeholder="Viết một vài dòng mô tả công năng sản phẩm..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-secondary">Danh mục ngành hàng</label>
                                    <select class="form-select" th:field="*{category}">
                                        <option value="">-- Chọn danh mục sản phẩm --</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-secondary">Giá bán lẻ (đ) <span class="text-danger">*</span></label>
                                    <input class="form-control" type="number" th:field="*{price}" placeholder="Nhập số tiền..." required />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-secondary">Số lượng tồn kho <span class="text-danger">*</span></label>
                                    <input class="form-control" type="number" th:field="*{stock}" placeholder="Nhập số lượng nhập kho..." required />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header py-3">
                        <h6 class="mb-0 text-secondary font-weight-bold">Hình ảnh đại diện sản phẩm</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Chọn tệp hình ảnh</label>
                            <input class="form-control" type="file" id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this)" />
                        </div>
                        <div id="previewContainer" class="mt-2">
                            <div id="oldPreview" th:if="${product.image != null && !product.image.isEmpty()}">
                                <p class="small fw-bold text-muted mb-1">Ảnh hiện tại:</p>
                                <img id="currentImage" th:src="${product.image}" class="preview-img shadow-sm" alt="Current product" />
                            </div>
                            <div id="newPreview" style="display:none;">
                                <p class="small fw-bold text-primary mb-1">Hình ảnh mới được chọn xem trước:</p>
                                <img id="previewImg" class="preview-img shadow-sm" alt="New preview" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card actions-sidebar shadow-sm p-3">
                    <div class="card-header bg-transparent border-0 pt-0 pb-2 ps-0">
                        <h6 class="mb-0 text-secondary font-weight-bold">Thao tác dữ liệu</h6>
                    </div>
                    <div class="card-body p-0 pt-2">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">💾 Lưu dữ liệu sản phẩm</button>
                        <a class="btn btn-outline-secondary w-100 mt-2 py-2" href="/admin/products">Quay lại danh sách</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div th:replace="~{admin/footer :: footer}"></div>

<script>
function previewImage(input) {
    const oldPreview = document.getElementById('oldPreview');
    const currentImage = document.getElementById('currentImage');
    const newPreview = document.getElementById('newPreview');
    const previewImg = document.getElementById('previewImg');

    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            if (currentImage) currentImage.style.display = 'none';
            if (oldPreview) oldPreview.style.display = 'none';
            
            previewImg.src = e.target.result;
            newPreview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    } else {
        newPreview.style.display = 'none';
        previewImg.src = '';
        if (currentImage) currentImage.style.display = 'block';
        if (oldPreview) oldPreview.style.display = 'block';
    }
}
</script>
</body>
</html>
