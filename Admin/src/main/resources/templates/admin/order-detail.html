<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Chi tiết đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="p-3">
<div th:replace="~{admin/header :: header}"></div>
<div class="container mt-4">
    <div th:if="${order != null}">
        <h2>Đơn hàng #<span th:text="${order.id}"></span></h2>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><strong>Thông tin khách hàng</strong></div>
                    <div class="card-body">
                        <p><strong>Tên:</strong> <span th:text="${order.user != null ? order.user.name : 'N/A'}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${order.user != null ? order.user.email : 'N/A'}"></span></p>
                        <p><strong>Điện thoại:</strong> <span th:text="${order.phoneNumber}"></span></p>
                        <p><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><strong>Thông tin đơn hàng</strong></div>
                    <div class="card-body">
                        <p><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <p><strong>Trạng thái:</strong> 
                            <form th:action="@{'/admin/orders/' + ${order.id} + '/update-status'}" method="post" style="display:inline">
                                <select name="status" class="form-select" onchange="this.form.submit()">
                                    <option value="pending" th:selected="${order.status == 'pending'}">Chưa xử lý</option>
                                    <option value="confirmed" th:selected="${order.status == 'confirmed'}">Đã xác nhận</option>
                                    <option value="shipping" th:selected="${order.status == 'shipping'}">Đang giao</option>
                                    <option value="delivered" th:selected="${order.status == 'delivered'}">Đã giao</option>
                                    <option value="cancelled" th:selected="${order.status == 'cancelled'}">Đã hủy</option>
                                </select>
                            </form>
                        </p>
                        <p><strong>Tổng tiền:</strong> <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')}"></span> đ</p>
                        <p><strong>Phương thức thanh toán:</strong> <span th:text="${order.paymentMethod}"></span></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header"><strong>Chi tiết sản phẩm</strong></div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Số lượng</th>
                            <th>Giá</th>
                            <th>Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td th:text="${item.product != null ? item.product.name : 'Sản phẩm đã bị xóa'}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-4">
            <a class="btn btn-secondary" href="/admin/orders">Quay lại danh sách</a>
        </div>
    </div>
    <div th:if="${order == null}" class="alert alert-warning">Không tìm thấy đơn hàng</div>
</div>
<div th:replace="~{admin/footer :: footer}"></div>
</body>
</html>
