<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Cấu hình Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="p-3">
<div th:replace="~{admin/header :: header}"></div>

<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-4" th:text="${category.id == null} ? 'Thêm danh mục mới' : 'Chỉnh sửa danh mục #' + ${category.id}"></h2>
    
    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post" class="card p-4 shadow-sm">
        
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label fw-bold">Tên danh mục <span class="text-danger">*</span></label>
            <input class="form-control" type="text" th:field="*{name}" placeholder="Nhập tên danh mục sản phẩm..." required />
        </div>
        
        <div class="mb-3">
            <label class="form-label fw-bold">Mô tả chi tiết</label>
            <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Nhập một vài dòng mô tả ngắn về danh mục này..."></textarea>
        </div>
        
        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">Lưu thông tin</button>
            <a class="btn btn-secondary px-4" href="/admin/categories">Hủy bỏ</a>
        </div>
    </form>
</div>

<div th:replace="~{admin/footer :: footer}"></div>
</body>
</html>
