<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Danh mục sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="p-3">
<div th:replace="~{admin/header :: header}"></div>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh mục sản phẩm</h2>
        <a class="btn btn-sm btn-primary px-3" href="/admin/categories/new">Thêm mới</a>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Tên danh mục</th>
                    <th>Mô tả</th>
                    <th class="text-center" style="width: 150px;">Số sản phẩm</th>
                    <th style="width: 160px;">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${categories}">
                    <td><strong th:text="${c.id}"></strong></td>
                    <td><span th:text="${c.name}"></span></td>
                    <td th:text="${#strings.abbreviate(c.description, 60)}"></td>
                    <td class="text-center">
                        <span class="badge bg-info text-dark fw-bold" th:text="${c.products != null ? c.products.size() : 0}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{'/admin/categories/' + ${c.id} + '/edit'}" class="btn btn-sm btn-warning text-dark">Sửa</a>
                            <form th:action="@{'/admin/categories/' + ${c.id} + '/delete'}" method="post" style="display:inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa danh mục này? Điều này có thể ảnh hưởng đến sản phẩm liên quan.');">
                                <button class="btn btn-sm btn-danger">Xóa</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${categories.isEmpty()}" class="alert alert-info">
        Không có danh mục nào. <a href="/admin/categories/new" class="alert-link">Thêm danh mục mới ngay</a>
    </div>
</div>

<div th:replace="~{admin/footer :: footer}"></div>
</body>
</html>
