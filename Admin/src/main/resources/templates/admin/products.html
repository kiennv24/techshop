<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-box { background: #fff; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); padding: 20px; }
        .product-img { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
        .badge-stock { font-size: 0.85rem; padding: 6px 10px; }
        .table th { font-weight: 600; color: #495057; background-color: #f8f9fa; }
    </style>
</head>
<body class="p-3">
<div th:replace="~{admin/header :: header}"></div>

<div class="container-fluid mt-4 px-4">
    <div class="card-box">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0 text-dark fw-bold">📦 Quản lý Sản phẩm</h2>
            <a class="btn btn-primary px-4 rounded-pill fw-semibold" href="/admin/products/new">+ Thêm mới</a>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 80px;" class="ps-3">Ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Danh mục</th>
                        <th>Đơn giá</th>
                        <th>Số lượng kho</th>
                        <th style="width: 160px;" class="pe-3">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td class="ps-3">
                            <img th:src="${p.image != null && !p.image.isEmpty()} ? ${p.image} : '/images/no-image.png'" 
                                 class="product-img shadow-sm" 
                                 alt="Product Image" 
                                 onerror="this.src='/images/no-image.png'" />
                        </td>
                        <td><strong class="text-dark" th:text="${p.name}"></strong></td>
                        <td>
                            <span class="badge bg-light text-secondary border" th:if="${p.category == null}">Chưa phân loại</span>
                            <span class="badge bg-info text-dark fw-semibold" th:if="${p.category != null}" th:text="${p.category.name}"></span>
                        </td>
                        <td class="fw-bold text-secondary">
                            <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}"></span> đ
                        </td>
                        <td>
                            <span class="badge badge-stock rounded-pill" 
                                  th:classappend="${p.stock <= 5 ? 'bg-danger' : (p.stock <= 20 ? 'bg-warning text-dark' : 'bg-success')}"
                                  th:text="${p.stock <= 0 ? 'Hết hàng (0)' : p.stock}"></span>
                        </td>
                        <td class="pe-3">
                            <div class="d-flex gap-2">
                                <a th:href="@{'/admin/products/' + ${p.id} + '/edit'}" class="btn btn-sm btn-warning text-dark px-3 rounded-2">Sửa</a>
                                <form th:action="@{'/admin/products/' + ${p.id} + '/delete'}" method="post" style="display:inline" onsubmit="return confirm('Bạn chắc chắn muốn xóa sản phẩm này?');">
                                    <button class="btn btn-sm btn-danger px-3 rounded-2">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${products.isEmpty()}" class="alert alert-info mt-3 rounded-3 shadow-sm">
            Hiện tại chưa có sản phẩm nào trong cơ sở dữ liệu. <a href="/admin/products/new" class="alert-link fw-bold">Thêm sản phẩm mới ngay</a>
        </div>
    </div>
</div>

<div th:replace="~{admin/footer :: footer}"></div>
</body>
</html>
