<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .avatar-placeholder { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #e9ecef; font-size: 20px; color: #6c757d; }
    </style>
</head>
<body class="p-3">
<div th:replace="admin/header :: header"></div>
<div class="container-fluid mt-4">
    <h2>Quản lý Người dùng</h2>
    <div class="table-responsive mt-3">
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th style="width: 60px;">Avatar</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Điện thoại</th>
                    <th>Vai trò</th>
                    <th style="width: 120px;">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td>
                        <img th:if="${u.avatar != null and u.avatar != ''}" th:src="${u.avatar}" class="avatar" alt="Avatar" onerror="this.classList.add('d-none'); this.nextElementSibling.classList.remove('d-none');" />
                        <div th:if="${u.avatar == null or u.avatar == ''}" class="avatar-placeholder"><i class="fas fa-user-circle"></i></div>
                        <div class="avatar-placeholder d-none" style="display: none;"><i class="fas fa-user-circle"></i></div>
                    </td>
                    <td><strong th:text="${u.name}"></strong></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.phone}"></td>
                    <td>
                        <span class="badge" th:classappend="${u.role == 'admin' ? 'bg-danger' : 'bg-primary'}" th:text="${u.role}"></span>
                    </td>
                    <td>
                        <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" style="display:inline" onsubmit="return confirm('Xóa người dùng?');">
                            <button class="btn btn-sm btn-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${users.isEmpty()}" class="alert alert-info">Không có người dùng nào.</div>
</div>
<div th:replace="admin/footer :: footer"></div>
</body>
</html>
